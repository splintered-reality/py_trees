[project]
name = "py_trees"
version = "2.5.0"
description = "pythonic implementation of behaviour trees"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Daniel Stonier", email = "d.stonier@gmail.com" },
    { name = "Naveed Usmani" },
    { name = "Michal Staniaszek" },
]
maintainers = [
    { name = "Daniel Stonier", email = "d.stonier@gmail.com" },
    { name = "Sebastian Castro", email = "sebas.a.castro@gmail.com" },
]
requires-python = ">=3.10,<4.0"
urls = { Homepage = "https://github.com/splintered-reality/py_trees", Repository = "https://github.com/splintered-reality/py_trees", Documentation = "https://py-trees.readthedocs.io/en/devel/" }
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
keywords = ["py_trees", "py-trees", "behaviour-trees"]

# Project dependencies
dependencies = ["pydot>=1.4"]

# Optional / development extras
[dependency-groups]
dev = [
    "tox",
    # "rust-just",
    "pytest",
    "uv",
    "pytest-cov",
    "pytest-console-scripts",
    # "prek",
]

# formatting extras
# format = [
#     "ufmt>=2.0",
# ]

# static analysis extras
static = ["mypy", "ty"]

# lint extras
lint = ["ruff"]

# docs extras
docs = ["sphinx<6", "sphinx-rtd-theme>=1.1", "sphinx-argparse>=0.4"]

[project.scripts]
"py-trees-render" = "py_trees.programs.render:main"
"py-trees-demo-action-behaviour" = "py_trees.demos.action:main"
"py-trees-demo-behaviour-lifecycle" = "py_trees.demos.lifecycle:main"
"py-trees-demo-blackboard" = "py_trees.demos.blackboard:main"
"py-trees-demo-blackboard-namespaces" = "py_trees.demos.blackboard_namespaces:main"
"py-trees-demo-blackboard-remappings" = "py_trees.demos.blackboard_remappings:main"
"py-trees-demo-context-switching" = "py_trees.demos.context_switching:main"
"py-trees-demo-display-modes" = "py_trees.demos.display_modes:main"
"py-trees-demo-dot-graphs" = "py_trees.demos.dot_graphs:main"
"py-trees-demo-either-or" = "py_trees.demos.either_or:main"
"py-trees-demo-eternal-guard" = "py_trees.demos.eternal_guard:main"
"py-trees-demo-logging" = "py_trees.demos.logging:main"
"py-trees-demo-pick-up-where-you-left-off" = "py_trees.demos.pick_up_where_you_left_off:main"
"py-trees-demo-selector" = "py_trees.demos.selector:main"
"py-trees-demo-sequence" = "py_trees.demos.sequence:main"
"py-trees-demo-tree-stewardship" = "py_trees.demos.stewardship:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "py_trees"
module-root = "."

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ufmt]
excludes = []
formatter = "ruff-api"
sorter = "usort"

[tool.ruff]
preview = false
line-length = 120
output-format = "concise"

[tool.ruff.lint]
select = ["ALL"]
# Remove ignores after issues addressed
ignore = [
    "ANN",
    "B",
    "C404",
    # Trailing comma, always ignore
    "COM812",
    "CPY",
    "D",
    "ERA001",
    "FA",
    "FBT",
    # Fix, always ignore
    "FIX",
    "FURB",
    "G001",
    # ISC001, always ignore
    "ISC001",
    "N",
    "PIE",
    "PLC",
    "PLR",
    "PLW",
    "PT",
    "PYI",
    "RUF",
    "SIM",
    "T201",
    # TD, always ignore
    "TD",
    "UP",
    "I001",
    "ARG",
    "C",
    "TRY",
    "RET",
    "PTH",
    "EM",
    "TCH",
    "G",
    "PERF",
    "S101",
    "F401",
    "PGH004",
    "F841",
    "BLE",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "B011", "ARG005"]
"tests/test_display.py" = ["ICN001", "S314"]
"docs/conf.py" = ["INP001", "S102", "A001", "F821"]

# Fix or ignore random number generator warning
"py_trees/behaviours.py" = ["S311"]
"docs/examples/skeleton_behaviour.py" = ["S311"]
# Fix or ignore subprocess usage warnings
"py_trees/demos/dot_graphs.py" = ["S603", "S607"]

[tool.ruff.lint.mccabe]
max-complexity = 15
